name: Deploy Next.js Portfolio to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Porfolio-GitHub/package-lock.json

      - name: Install dependencies
        run: cd Porfolio-GitHub && npm ci

      - name: Build static export
        run: cd Porfolio-GitHub && npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Porfolio-GitHub/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
