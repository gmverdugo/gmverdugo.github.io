<article
  class="metric-tile"
  [class]="'accent-' + accent()"
  role="button"
  tabindex="0"
  (click)="onClick()"
  (keydown.enter)="onClick()"
  (keydown.space)="onClick()"
>
  <div class="metric-tile__label">{{ title() }}</div>
  <h3 class="metric-tile__headline">{{ headline() }}</h3>

  <div class="metric-tile__metrics">
    @for (metric of metrics(); track metric.label) {
      <div class="metric-tile__metric" [class]="'accent-' + metric.accent">
        <div class="metric-tile__value">{{ metric.value }}</div>
        <div class="metric-tile__metric-label">{{ metric.label }}</div>
      </div>
    }
  </div>
</article>
