<article class="role-badge">
  <span class="role-badge__icon" aria-hidden="true">&#x2713;</span>

  <div class="role-badge__body">
    <h3 class="role-badge__role">{{ roleName() }}</h3>
    <p class="role-badge__issuer">{{ issuer() }}</p>
    <p class="role-badge__granted">{{ grantedLabel() }} {{ grantedDate() }}</p>

    @if (note()) {
      <p class="role-badge__note">{{ note() }}</p>
    }
  </div>
</article>
