@if (view(); as detail) {
  <section class="service-detail">
    <header class="service-detail__header">
      <h1 class="service-detail__title">{{ detail.title }}</h1>
      <p class="service-detail__summary">{{ detail.summary }}</p>
    </header>

    <div class="service-detail__metrics">
      @for (metric of detail.metrics; track metric.label) {
        <div class="service-detail__metric" [class]="'accent-' + metric.accent">
          <div class="service-detail__metric-value">{{ metric.value }}</div>
          <div class="service-detail__metric-label">{{ metric.label }}</div>
        </div>
      }
    </div>

    @if (detail.reportFile) {
      <div class="service-detail__report">
        <app-console-card
          [title]="detail.reportTitle"
          [src]="reportSrc(detail.reportFile)"
          [fallbackMessage]="detail.reportFallbackMessage"
        />
      </div>
    }
  </section>
} @else {
  <section class="service-detail service-detail--not-found">
    <p>{{ notFoundMessage() }}</p>
  </section>
}
